<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>食世界 - 今天吃什么</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-label="食世界菜谱筛选器">
        <aside id="filterPanel" class="filters" aria-label="筛选条件">
          <div class="filter-panel-head">
            <div class="brand">
              <span class="brand-mark">食</span>
              <div>
                <h1>食世界</h1>
                <p>今天吃什么，先缩小选择。</p>
              </div>
            </div>
            <button id="closeFiltersButton" class="icon-button panel-close" type="button" aria-label="关闭筛选">x</button>
          </div>

          <div id="filterGroups" class="filter-groups"></div>

          <div class="filter-actions">
            <button id="clearButton" class="ghost-button" type="button">清空筛选</button>
          </div>
        </aside>

        <section class="results" aria-label="菜谱结果">
          <header class="hero">
            <p class="eyebrow">TasteWorld v0.4</p>
            <div class="hero-title-row">
              <div>
                <h2>今天吃什么？</h2>
                <p>84 道家常、轻食与健身餐，按目标、营养、时间和忌口筛一筛。</p>
              </div>
              <div class="result-count">
                <strong id="resultCount">0</strong>
                <span>道菜</span>
              </div>
            </div>

            <label class="search-box hero-search">
              <span>关键词</span>
              <input id="keywordInput" type="search" placeholder="搜菜名、食材、做法" autocomplete="off" />
            </label>

            <div class="hero-actions">
              <button class="primary-button" type="button" data-action="random">随机一道</button>
              <button class="ghost-button" type="button" data-action="share">复制分享链接</button>
            </div>
          </header>

          <section class="featured" aria-label="今日推荐">
            <div class="section-head">
              <div>
                <p class="eyebrow">Daily Picks</p>
                <h3>今日推荐</h3>
              </div>
              <span>快手 / 清淡 / 高蛋白</span>
            </div>
            <div id="featuredRecipes" class="featured-grid"></div>
          </section>

          <section class="fitness-zone" aria-label="健身餐专题">
            <div class="section-head">
              <div>
                <p class="eyebrow">Fitness Meals</p>
                <h3>健身餐专题</h3>
              </div>
              <span>减脂 / 增肌 / 训练后 / 备餐</span>
            </div>
            <div class="fitness-grid">
              <button class="fitness-card" type="button" data-fitness-preset="cut">
                <strong>减脂高蛋白</strong>
                <span>优先看热量更稳、蛋白更够的日常餐。</span>
                <small>fitness=减脂 · macro=高蛋白</small>
              </button>
              <button class="fitness-card" type="button" data-fitness-preset="bulk">
                <strong>增肌补能</strong>
                <span>适合需要碳水和蛋白一起补上的正餐。</span>
                <small>fitness=增肌 · macro=高碳水</small>
              </button>
              <button class="fitness-card" type="button" data-fitness-preset="recovery">
                <strong>训练后恢复</strong>
                <span>训练后优先补蛋白，兼顾饱腹和恢复。</span>
                <small>fitness=训练后 · macro=高蛋白</small>
              </button>
              <button class="fitness-card" type="button" data-fitness-preset="prep">
                <strong>可备餐便当</strong>
                <span>适合提前做好，第二天带饭或复热。</span>
                <small>prep=1</small>
              </button>
            </div>
          </section>

          <div class="status-bar">
            <span id="activeSummary">未选择筛选条件</span>
            <span id="activeCountText">已选 0 项</span>
          </div>

          <div id="recipeGrid" class="recipe-grid"></div>
          <div id="emptyState" class="empty-state" hidden>
            <strong>没有匹配结果</strong>
            <span>试试减少筛选条件，或清空忌口标签后再看一遍。</span>
          </div>
        </section>
      </section>
    </main>

    <div id="filterBackdrop" class="filter-backdrop" hidden></div>

    <nav class="mobile-bar" aria-label="移动端操作">
      <button id="openFiltersButton" type="button">
        <span>筛选</span>
        <strong id="activeCountBadge">0</strong>
      </button>
      <button type="button" data-action="random">随机一道</button>
      <button type="button" data-action="share">分享链接</button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <dialog id="recipeDialog" class="recipe-dialog" aria-labelledby="dialogTitle">
      <button id="closeDialog" class="close-button" type="button" aria-label="关闭详情">x</button>
      <div id="dialogContent"></div>
    </dialog>

    <script src="./recipes.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
